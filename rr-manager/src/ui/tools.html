<!DOCTYPE html>
<html class="rrmHtml" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RR Manager Tools</title>
    <link rel="stylesheet" href="/webman/3rdparty/rr-manager/style.css">
</head>
<body class="rrm subPage" data-page="tools">
    <main class="panel panelSolo">
        <div class="panelHead">
            <div>
                <h2 data-i18n="tools.title">Tools</h2>
            </div>
            <div class="actionRow compact">
                <button id="refreshPackages" type="button" data-i18n="common.refresh">Refresh</button>
            </div>
        </div>
        <p class="lead" data-i18n="tools.pkgHint">Choose how each installed package's service process runs.</p>
        <label class="field">
            <span data-i18n="tools.pkgFilter">Filter packages</span>
            <input id="searchInput" type="text" placeholder="Search by package name" data-i18n-placeholder="tools.searchPlaceholder">
        </label>
        <div class="tableWrap">
            <table class="listTable narrowTable">
                <colgroup>
                    <col class="colName">
                    <col class="colRunAs">
                </colgroup>
                <thead>
                    <tr>
                        <th class="colName" data-i18n="table.name">Name</th>
                        <th data-i18n="tools.runAs">Run As</th>
                    </tr>
                </thead>
                <tbody id="packagesBody"></tbody>
            </table>
        </div>
    </main>
    <div class="toast" id="toast" hidden></div>
    <script src="/webman/3rdparty/rr-manager/app.js"></script>
</body>
</html>
